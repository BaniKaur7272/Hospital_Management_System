<!DOCTYPE html>
<html>
<head>
<title>Appointments</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

<div class="sidebar">
<h2>Pulse COS</h2>
<ul>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="patients.html">Patients</a></li>
<li><a href="doctors.html">Doctors</a></li>
<li class="active"><a href="appointments.html">Appointments</a></li>
</ul>
</div>

<div class="main">

<h2>Appointments</h2>
<button onclick="window.location.href='add_appointment.html'" class="add-btn">
+ New Appointment
</button>

<div class="stats-row">

<div class="stat-card">7<br><span>Today</span></div>
<div class="stat-card">7<br><span>Scheduled</span></div>
<div class="stat-card">3<br><span>Completed</span></div>
<div class="stat-card">12<br><span>Total</span></div>

</div>

<input type="text" id="appointmentSearch" class="search" placeholder="Search appointments...">

<div id="appointmentList"></div>

</div>

<script>
document.getElementById("appointmentForm").addEventListener("submit", function(e){
e.preventDefault();

let patient = document.getElementById("patient").value;
let doctor = document.getElementById("doctor").value;
let time = document.getElementById("time").value;
let status = document.getElementById("status").value;

let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

appointments.push({
patient: patient,
doctor: doctor,
time: time,
status: status
});

localStorage.setItem("appointments", JSON.stringify(appointments));

alert("Appointment Added!");
window.location.href = "appointments.html";
});
</script>


</body>
</html>
